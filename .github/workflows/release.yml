name: release

# 推 tag（v0.1.1 形式）即发布到 npm 官方源。
# 走 npm Trusted Publishing（OIDC）：仓库里不需要 NPM_TOKEN 之类的长期密钥，
# 每次发布用 GitHub Actions 的短时 OIDC 身份换取一次性凭证，provenance 自动生成。
#
# 前置条件（在 npm 包页 Settings → Trusted publishing 一次性配置）：
#   Organization or user : ddssh
#   Repository           : dsh-joplin
#   Workflow filename    : release.yml        ← 只写文件名，必须含 .yml
#   Environment name     : 留空
#   Allowed actions      : 必须勾上「允许 npm publish」
#                          （2026-09-03 后新建的配置默认只允许 stage publish；
#                            不勾的话本 workflow 的 npm publish 会被拒绝。）
# 注意：新建的 trusted publisher 需在 2 天内完成首次成功发布，否则作废。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # 创建 GitHub Release
  id-token: write # OIDC：trusted publishing 与 provenance 签名都靠它（必需）

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false # 发布构建不缓存

      - name: Check npm CLI (trusted publishing needs >= 11.5.1)
        run: |
          node -v
          npm -v
          node -e '
            const [maj, min, pat] = require("child_process").execSync("npm -v").toString().trim().split(".").map(Number);
            const need = [11, 5, 1];
            const cur = [maj, min, pat];
            const ok = cur[0] > need[0] || (cur[0] === need[0] && (cur[1] > need[1] || (cur[1] === need[1] && cur[2] >= need[2])));
            if (!ok) { console.error(`npm ${cur.join(".")} is too old for OIDC trusted publishing (need >= 11.5.1)`); process.exit(1); }
          '

      - name: Verify tag matches package.json version
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json=${PKG}  tag=${TAG}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${PKG}"
            exit 1
          fi

      - name: Smoke test (mock Joplin)
        run: node test/smoke.mjs

      - name: Skip if this version is already on the registry
        id: gate
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "dsh-joplin@${VERSION}" version >/dev/null 2>&1; then
            echo "::notice::dsh-joplin@${VERSION} is already published — skipping publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm via OIDC
        if: steps.gate.outputs.publish == 'true'
        run: |
          # 认证来自 GitHub OIDC（id-token: write），无需 NPM_TOKEN
          npm publish --access public

      - name: Wait for the version to go live
        if: steps.gate.outputs.publish == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # 发布可能返回 202（registry 异步处理），轮询到版本可查为止
          for i in $(seq 1 18); do
            if npm view "dsh-joplin@${VERSION}" version >/dev/null 2>&1; then
              echo "dsh-joplin@${VERSION} is live"
              break
            fi
            echo "waiting for registry ($i/18)..."
            sleep 10
          done
          npm view "dsh-joplin@${VERSION}" version

      - name: Verify provenance attestation
        if: steps.gate.outputs.publish == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for i in $(seq 1 12); do
            ATTEST=$(npm view "dsh-joplin@${VERSION}" dist.attestations --json 2>/dev/null || true)
            if echo "$ATTEST" | grep -qi 'provenance'; then
              echo "$ATTEST"
              exit 0
            fi
            echo "waiting for attestation ($i/12)..."
            sleep 10
          done
          echo "::error::dsh-joplin@${VERSION} has no provenance attestation"
          exit 1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "::notice::release ${GITHUB_REF_NAME} already exists"
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "npm: https://www.npmjs.com/package/dsh-joplin/v/${VERSION}"
